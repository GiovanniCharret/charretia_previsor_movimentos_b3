# Gera as quatro páginas do site e publica no GitHub Pages.
#
# ORDEM IMPORTA. `gerar_extremos.py` roda primeiro porque deixa em `saida/estado.json` quantos papéis
# estão em destaque hoje, e é dele que as outras duas tiram o contador da barra de abas. Invertida a ordem,
# o site publica com o contador do dia anterior — ou sem contador nenhum na primeira execução.
#
# Falha do BOVA11 derruba o job de propósito: `gerar_tela.py` encerra com erro quando o índice não
# passa na peneira, porque sem a leitura mestra a página viraria uma lista de sinais soltos. Falhas
# de papéis individuais os geradores absorvem e seguem.
name: Publicar tela

on:
  # Publica a cada mudança na branch padrão. Sem este gatilho, `schedule` espera o horário e
  # `workflow_dispatch` espera um clique — e nada acontece ao subir código novo.
  push:
    branches: [main]
  schedule:
    # 21:30 UTC = 18:30 de Brasília, depois do fechamento da B3. Só dias úteis.
    # ATENÇÃO: agendamento só dispara na branch padrão do repositório.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:            # botão de execução manual, na aba Actions

# Permissões mínimas para publicar no Pages pela via de Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # São dois conjuntos de downloads (100 papéis para a faixa extrema e 100 para a triagem):
    # 3 a 6 minutos no total. A folga cobre lentidão da fonte sem travar a fila.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Os testes rodam offline, com preços sintéticos: não tocam a rede e levam segundos.
      # Aqui eles cabem, porque este repositório não carrega o laboratório junto.
      - name: Rodar os testes
        run: pip install pytest && python -m pytest -q

      # Primeiro a faixa extrema (v3): ela lê os cortes e as medidas do laboratório em `estudo/` e
      # grava `saida/estado.json`, de onde as outras duas tiram o contador. A tela de gatilhos (v2)
      # foi descontinuada em 04/11/2026; o registro dela continua na página de método.
      - name: Gerar a tela da faixa extrema
        run: python gerar_extremos.py

      # Bancos e elétricas (v4): lê os cortes do laboratório e o contador gravado pelo passo acima.
      - name: Gerar a tela de bancos e elétricas
        run: python gerar_setores.py

      - name: Gerar a tela de triagem
        run: python gerar_tela.py

      # Não toca a rede: o conteúdo vem inteiro de `versoes.py`.
      - name: Gerar a página de método
        run: python gerar_metodo.py

      # Sem esta conferência, uma saída no lugar errado vira um 404 no site — falha silenciosa, que
      # só aparece quando alguém abre a página. Aqui vira erro no log, com a árvore impressa.
      - name: Conferir o que será publicado
        run: |
          echo "conteúdo de saida/:"
          find saida -maxdepth 2 | sort
          # As quatro páginas, os dois estilos e o estado do dia. Qualquer ausência aqui vira um 404
          # ou uma página sem formatação no ar — falha silenciosa, que só aparece ao abrir o site.
          for arquivo in index.html extremos.html setores.html metodo.html estilo.css estilo_componentes.css; do
            test -f "saida/$arquivo" \
              || { echo "::error::$arquivo não está na pasta publicada"; exit 1; }
          done
          # Um marcador não substituído apareceria literalmente na página publicada.
          if grep -l '{{' saida/*.html; then
            echo "::error::há marcadores de template não substituídos"; exit 1
          fi
          echo "planilhas: $(ls saida/dados/*.xlsx | wc -l)"

      # `enablement: true` habilita o Pages pela API na primeira execução, em vez de exigir que
      # alguém acerte Settings → Pages à mão. Sem isto, o passo falha com "Get Pages site failed"
      # enquanto a origem não estiver em GitHub Actions — que é o estado padrão de um repo novo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # A pasta inteira, não só o index.html: os botões de download apontam para dados/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: saida

      - id: publicacao
        uses: actions/deploy-pages@v4
